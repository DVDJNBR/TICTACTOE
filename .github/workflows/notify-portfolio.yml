name: Notify Portfolio

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio rebuild
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/DVDJNBR/PORTFOLIO/dispatches \
            -d '{"event_type":"asset-updated"}'
